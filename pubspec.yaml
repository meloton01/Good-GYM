name: good_gym
description: "Good GYM: gym leaderboard with video-verified records and workouts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  file_saver: ^0.7.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  video_compress: ^3.1.4
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  fake_cloud_firestore: ^4.5.0
flutter:
  uses-material-design: true
  generate: true
